version: '3.8'

# ─────────────────────────────────────────────────────────────
#  Override para desarrollo local
#  Uso: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up
#
#  Diferencias con producción:
#  - Los servicios exponen sus puertos directamente (sin pasar por Kong)
#    para que puedas llamarlos directo con Postman / Swagger
#  - MAIL_DEV_MODE=true (no envía correos reales)
#  - JWT_SECRET tiene un valor por defecto
# ─────────────────────────────────────────────────────────────

services:

  redis:
    ports:
      - "6379:6379"

  auth-service:
    ports:
      - "8080:8080"
    environment:
      MAIL_DEV_MODE: "true"
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key-must-be-at-least-32-chars}

  user-service:
    ports:
      - "8081:8081"

  registration-service:
    ports:
      - "8082:8082"

  kong:
    ports:
      - "8000:8000"
      - "8001:8001"   # Admin API expuesto solo en local para debug
