_format_version: "3.0"
_transform: true

# ─────────────────────────────────────────────────────────────
#  PATRICIA – Kong declarative config (DB-less)
#
#  Validación JWT:
#  - Kong valida el token en TODAS las rutas excepto /api/v1/auth/**
#  - Si el token es inválido → Kong devuelve 401 sin tocar el servicio
#  - Los servicios solo decodifican el sub (userId) del token,
#    no necesitan verificar la firma
#
#  Cómo agregar un nuevo microservicio:
#  1. Agregar un bloque en `services`
#  2. Agregar las rutas en `routes` dentro del servicio
#  3. Agregar el servicio en docker-compose.yml
#  4. Hacer `docker compose restart kong` para recargar la config
# ─────────────────────────────────────────────────────────────

# ── Consumer genérico para validación JWT ─────────────────────
# Kong necesita un consumer con el secret para verificar los tokens
consumers:
  - username: patricia-services
    jwt_secrets:
      - key: "patricia-auth-service"   # debe coincidir con iss en el JWT
        secret: "{vault://env/JWT_SECRET}"

# ─────────────────────────────────────────────────────────────
services:

  # ── Auth Service (público — NO requiere JWT) ───────────────
  - name: auth-service
    url: http://auth-service:9090
    connect_timeout: 10000
    read_timeout: 30000
    routes:
      - name: auth-routes
        paths:
          - /api/v1/auth
        strip_path: false
        methods:
          - POST
          - OPTIONS
    plugins:
      - name: jwt
        enabled: false   # auth no requiere token (es donde se obtiene)

  # ── Profile Service ────────────────────────────────────────
  - name: matchpuff-profile-service
    url: http://matchpuff-profile-service:8081
    connect_timeout: 10000
    read_timeout: 30000
    routes:
      - name: profile-routes
        paths:
          - /api/v1/users
          - /api/v1/profiles
        strip_path: false
        methods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS

  # ── Servicio 3 ─────────────────────────────────────────────
  # - name: nombre-servicio
  #   url: http://nombre-servicio:808X
  #   connect_timeout: 10000
  #   read_timeout: 30000
  #   routes:
  #     - name: nombre-routes
  #       paths:
  #         - /api/v1/nombre
  #       strip_path: false

  # ── Servicios 4 ... 12: mismo patrón ───────────────────────


# ─────────────────────────────────────────────────────────────
#  Plugins globales (aplican a TODOS los servicios)
# ─────────────────────────────────────────────────────────────
plugins:

  # ── JWT — valida el token antes de llegar al servicio ───────
  # Auth-service tiene jwt: disabled arriba, todos los demás lo requieren
  - name: jwt
    config:
      key_claim_name: iss          # busca el consumer por el claim `iss`
      claims_to_verify:
        - exp                      # verifica que el token no haya expirado
      run_on_preflight: false

  # ── CORS ────────────────────────────────────────────────────
  - name: cors
    config:
      origins:
        - "*"
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Authorization
        - Content-Type
        - Accept
      exposed_headers:
        - Authorization
      credentials: true
      max_age: 3600

  # ── Rate limiting ────────────────────────────────────────────
  - name: rate-limiting
    config:
      minute: 100
      hour: 3000
      policy: local
      fault_tolerant: true
      hide_client_headers: false

  # ── Tamaño máximo de request ─────────────────────────────────
  - name: request-size-limiting
    config:
      allowed_payload_size: 5
