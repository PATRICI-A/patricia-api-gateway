_format_version: "3.0"
_transform: true

consumers:
  - username: patricia-services
    jwt_secrets:
      - key: "patricia-auth-service"
        secret: "${JWT_SECRET}"

services:
  - name: auth-service
    url: ${URL_AUTH}
    connect_timeout: 10000
    read_timeout: 30000
    routes:
      - name: auth-routes
        paths:
          - /api/v1/auth
        strip_path: false
        methods:
          - POST
          - OPTIONS

  - name: profile-service
    url: ${URL_PROFILE}
    connect_timeout: 10000
    read_timeout: 30000
    routes:
      - name: profile-registration-student
        paths:
          - /api/v1/users/student
        strip_path: false
        methods:
          - POST
          - OPTIONS
      - name: profile-routes
        paths:
          - /api/v1/users
          - /api/v1/profiles
        strip_path: false
        methods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS
        plugins:
          - name: jwt
      - name: profile-internal-routes
        paths:
          - /api/v1/internal
        strip_path: false
        methods:
          - GET
          - PATCH
        plugins:
          - name: jwt

  - name: hangout-service
    url: ${URL_HANGOUT}
    connect_timeout: 10000
    read_timeout: 30000
    routes:
      - name: hangout-parches-routes
        paths:
          - /api/v1/parches
        strip_path: false
        methods:
          - GET
          - POST
          - PATCH
          - DELETE
          - OPTIONS
      - name: hangout-invitaciones-routes
        paths:
          - /api/v1/invitaciones
        strip_path: false
        methods:
          - GET
          - POST
          - PATCH
          - OPTIONS
    plugins:
      - name: jwt

  - name: chat-service
    url: ${URL_CHAT}
    connect_timeout: 10000
    read_timeout: 30000
    routes:
      - name: chat-messages-routes
        paths:
          - /api/parches
        strip_path: false
        methods:
          - GET
          - OPTIONS
      - name: chat-connections-routes
        paths:
          - /api/connections
        strip_path: false
        methods:
          - GET
          - POST
          - PATCH
          - OPTIONS
    plugins:
      - name: jwt

  - name: notification-service
    url: ${URL_NOTIFICATION}
    connect_timeout: 10000
    read_timeout: 30000
    routes:
      - name: notification-routes
        paths:
          - /api/notifications
        strip_path: false
        methods:
          - GET
          - POST
          - PUT
          - OPTIONS
      - name: event-reminder-routes
        paths:
          - /api/event-reminders
        strip_path: false
        methods:
          - POST
          - OPTIONS
    plugins:
      - name: jwt

  - name: gamification-service
