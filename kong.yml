        strip_path: false
        methods:
          - GET
          - POST
          - PATCH
          - OPTIONS
      - name: rewards-routes
        paths:
          - /api/v1/rewards
        strip_path: false
        methods:
          - GET
          - POST
          - OPTIONS
    plugins:
      - name: jwt

  - name: feed-search-service
    url: ${URL_FEED_SEARCH}
    connect_timeout: 10000
    read_timeout: 30000
    routes:
      - name: feed-routes
        paths:
