  - name: geo-service
    url: ${URL_GEO}
    connect_timeout: 10000
    read_timeout: 30000
    routes:
      - name: geo-routes
        paths:
          - /api/v1/geo
        strip_path: false
        methods:
          - GET
          - PUT
          - OPTIONS
    plugins:
      - name: jwt

  - name: campus-events-service
    url: ${URL_EVENTS}
    connect_timeout: 10000
    read_timeout: 30000
    routes:
      - name: events-routes
        paths:
          - /api/v1/events
        strip_path: false
        methods:
          - GET
          - POST
          - PUT
          - DELETE
