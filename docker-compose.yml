version: '3.8'

# ─────────────────────────────────────────────────────────────
#  PATRICIA – API Gateway + microservicios
#  Uso: docker-compose --env-file .env up -d
# ─────────────────────────────────────────────────────────────

services:

  # ── Infraestructura ────────────────────────────────────────

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data

  # ── API Gateway ────────────────────────────────────────────

  kong:
    image: kong:3.7
    restart: unless-stopped
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      KONG_ADMIN_LISTEN: "127.0.0.1:8001"
      KONG_LOG_LEVEL: warn
      JWT_SECRET: ${JWT_SECRET}          # usado por kong.yml para validar tokens
    volumes:
      - ./kong/kong.yml:/kong/kong.yml:ro
    ports:
      - "8000:8000"
    depends_on:
      - auth-service
      - matchpuff-profile-service
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Microservicios ─────────────────────────────────────────

  auth-service:
    image: ${AUTH_SERVICE_IMAGE}
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      PORT: 9090
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      USER_SERVICE_URL: http://matchpuff-profile-service:8081
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-900000}
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
    depends_on:
      - redis
      - matchpuff-profile-service

  matchpuff-profile-service:
    image: ${PROFILE_SERVICE_IMAGE}
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      MONGO_URI: ${MONGO_URI}
      AUTH_SERVICE_URL: http://auth-service:9090

  # ── Agrega aquí los 10 servicios restantes ─────────────────
  # Sigue el mismo patrón:
  #
  # nombre-servicio:
  #   image: ${NOMBRE_SERVICIO_IMAGE}
  #   restart: unless-stopped
  #   environment:
  #     SPRING_PROFILES_ACTIVE: prod
  #     JWT_SECRET: ${JWT_SECRET}        # todos los servicios necesitan esto
  #     <otras variables del servicio>
  #
  # Y agrega la ruta en kong/kong.yml

volumes:
  redis_data:
